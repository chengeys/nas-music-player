# 在 nas.yjm.ccwu.cc 的反代 server 段中添加（宝塔 → 网站 → 设置 → 配置文件）
# 作用：把 /dav/ 代理到群晖 WebDAV(5006)，并加上跨域头，让手机网页能直接播歌
# 注意：proxy_pass 的主机照抄你现有配置里 DSM 反代的那台，只把端口改成 5006

location /dav/ {
    proxy_pass https://<照抄现有DSM反代主机>:5006/;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 把浏览器的认证头透传给群晖
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Depth $http_depth;
    proxy_set_header Destination $http_destination;
    proxy_set_header Overwrite $http_overwrite;
    proxy_set_header If $http_if;
    # 跨域头（手机网页必需）
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS, PROPFIND" always;
    add_header Access-Control-Allow-Headers "Authorization, Depth, Content-Type, Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    # 预检请求直接返回
    if ($request_method = OPTIONS) { return 204; }
}
