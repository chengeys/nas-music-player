<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>知行音乐</title>
<meta name="theme-color" content="#14141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="知行音乐">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=9.27">
</head>
<body>
<div id="app">
  <div id="toast" style="display:none"></div>

  <!-- 顶部栏 -->
  <header id="topbar">
    <span id="logo">🎵 知行音乐</span>
    <span style="flex:1"></span>
    <button id="userBtn" title="账号">👤</button>
    <button id="carBtn" title="车载模式">🚗</button>
  </header>

  <!-- 推荐页（音乐馆） -->
  <section id="view-home" class="view active">
    <div class="qq-banner">
      <div class="qq-greet" id="qqGreet">音乐馆</div>
      <div class="qq-sub" id="qqStats">-</div>
    </div>
    <div class="qq-quick">
      <button data-go="rec">❤️<span>猜你喜欢</span></button>
      <button data-go="recent">🕘<span>最近播放</span></button>
      <button data-go="shuffle">🎲<span>随机听</span></button>
      <button data-go="folders">📁<span>我的合集</span></button>
    </div>
    <div class="qq-run">
      <button id="runBtn">🏃 跑步模式 · 180 步频<span>不用选歌，一键开跑，自动连播</span></button>
    </div>
    <div class="block" id="blockFolders">
      <h2>我的合集</h2>
      <div id="folderList" class="qq-grid"></div>
    </div>
    <div class="block" id="blockRec">
      <h2>猜你喜欢 <button id="refreshRec" class="mini-btn">换一批</button></h2>
      <div id="recList" class="songlist"><p class="empty">多听几首，推荐越准</p></div>
      <button id="recMore" class="more-btn" style="display:none"></button>
    </div>
    <div class="block" id="blockRecent">
      <h2>继续听</h2>
      <div id="recentList" class="songlist"><p class="empty">还没有播放记录，听几首歌就记住了</p></div>
    </div>
  </section>

  <!-- 搜索页 -->
  <section id="view-search" class="view">
    <div class="searchbar">
      <input id="q" type="search" placeholder="搜歌名 / 歌手，如：晴天 周杰伦" autocomplete="off">
      <button id="micBtn" title="语音搜歌">🎤</button>
    </div>
    <p id="voiceHint" class="hint" style="display:none"></p>
    <div id="searchList" class="songlist"><p class="empty">在上面输入，或按 🎤 说句话</p></div>
  </section>

  <!-- 我的歌单页 -->
  <section id="view-playlists" class="view">
    <div class="block">
      <h2>我的歌单 <button id="newPlaylistBtn" class="mini-btn">＋新建</button></h2>
      <div id="playlistList" class="songlist"><p class="empty">登录后歌单多设备同步</p></div>
    </div>
    <div class="block" id="playlistDetailBlock" style="display:none">
      <h2 id="playlistDetailName">歌单</h2>
      <div id="playlistDetailList" class="songlist"></div>
      <button id="backToPlaylists" class="btn ghost">‹ 返回歌单列表</button>
    </div>
  </section>

  <!-- 设置页 -->
  <section id="view-settings" class="view">
    <div class="block">
      <h2>账号</h2>
      <p class="hint" id="accountHint">游客模式：收藏和记录只保存在这台设备。登录后多设备同步。</p>
      <div class="row">
        <button id="accountBtn" class="btn">登录 / 注册</button>
        <button id="logoutBtn" class="btn ghost" style="display:none">退出登录</button>
      </div>
    </div>
    <div class="block">
      <h2>数据</h2>
      <div class="row">
        <button id="clearHist" class="btn ghost danger">清除播放记录</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="forceUpdate" class="btn ghost">🔄 强制更新到最新版</button>
      </div>
      <p class="hint">曲库共 <span id="libCount">-</span> 首 · <span id="appVer"></span></p>
      <p class="hint">播放出问题时，把下面这段日志截图发给墨恒：</p>
      <pre id="diagLog" style="font-size:10px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:#8e8e99;max-height:180px;overflow:auto;background:#15151b;border-radius:8px;padding:8px;">（暂无记录）</pre>
    </div>
  </section>

  <!-- 迷你播放器 -->
  <div id="miniPlayer" style="display:none">
    <div id="miniProg"><div id="miniProgFill"></div><div id="miniProgKnob"></div></div>
    <img id="miniCover" class="hide" alt="">
    <div id="miniInfo"><b id="miniTitle">-</b><span id="miniArtist"></span></div>
    <button id="miniPrev">⏮</button>
    <button id="miniToggle" class="primary">⏸</button>
    <button id="miniNext">⏭</button>
  </div>

  <!-- 全屏播放器（QQ音乐风） -->
  <div id="fullPlayer" style="display:none">
    <div id="fpBg"></div>
    <div class="fp-head">
      <button id="closePlayer">﹀</button>
      <div class="fp-titles"><div id="fpTitle">-</div><div id="fpArtist">-</div></div>
      <button id="fpTab">详情</button>
    </div>
    <div class="fp-cover-wrap">
      <img id="fpCoverImg" alt="封面" style="display:none">
      <div id="fpCoverPh">🎵</div>
    </div>
    <div class="fp-actions">
      <button id="fpLike" title="我喜欢">♡</button>
      <button id="fpAdd" title="加入歌单">＋</button>
      <button id="fpDl" title="详情">ⓘ</button>
      <button id="fpShare" title="分享">↗</button>
    </div>
    <div id="fpLyrics"></div>
    <div id="lrcSeekChip" style="display:none"></div>
    <div id="fpDetail" style="display:none"></div>
    <div id="fpQueue" style="display:none">
      <div class="fp-queue-head"><span id="fpQueueTitle">播放列表</span><button id="fpQueueClose" class="mini-btn">返回歌词</button></div>
      <div id="fpQueueList" class="songlist"></div>
    </div>
    <div class="fp-progress">
      <span id="tCur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span id="tDur">0:00</span>
    </div>
    <div id="fpControls">
      <button id="fpMode" title="播放模式">🔁</button>
      <button id="fpPrev">⏮</button>
      <button id="fpToggle" class="big">⏸</button>
      <button id="fpNext">⏭</button>
      <button id="fpList" title="播放列表">☰</button>
    </div>
    <p id="playStatus" class="hint"></p>
  </div>

  <!-- 登录弹窗 -->
  <div id="loginModal" style="display:none">
    <div class="modal-card">
      <h2 id="loginTitle">登录</h2>
      <div class="row" style="margin-bottom:10px">
        <button id="tabLogin" class="btn ghost">登录</button>
        <button id="tabRegister" class="btn ghost">注册</button>
      </div>
      <label>用户名
        <input id="loginUser" type="text" placeholder="2-20 位，字母/数字/中文" autocomplete="username">
      </label>
      <label>密码
        <input id="loginPass" type="password" placeholder="4 位以上" autocomplete="current-password">
      </label>
      <p id="loginErr" class="hint err" style="display:none"></p>
      <div class="row">
        <button id="loginGo" class="btn">登录</button>
        <button id="loginGuest" class="btn ghost">游客继续</button>
      </div>
      <button id="loginClose" class="btn ghost" style="margin-top:10px">关闭</button>
      <p class="hint">密码加密后保存，可多设备同步收藏、歌单和播放记录。</p>
    </div>
  </div>

  <!-- 加入歌单弹窗 -->
  <div id="addToPlaylistModal" style="display:none">
    <div class="modal-card">
      <h2>加入歌单</h2>
      <div id="addToPlaylistList" class="songlist"></div>
      <button id="addToPlaylistClose" class="btn ghost" style="margin-top:10px">关闭</button>
    </div>
  </div>

  <!-- 底部导航 -->
  <nav id="tabbar">
    <button data-view="view-home" class="active">🏠<span>推荐</span></button>
    <button data-view="view-search">🔍<span>搜歌</span></button>
    <button data-view="view-playlists">🎵<span>歌单</span></button>
    <button data-view="view-settings">⚙️<span>设置</span></button>
  </nav>
</div>

<script src="catalog.js"></script>
<script src="cloud.js?v=9.27"></script>
<script src="app.js?v=9.27"></script>
</body>
</html>
